name: Discord Release Notification

on:
  release:
    types: [edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce (e.g. v1.29.0 or v1.29.0-beta.1). Empty = latest stable.'
        required: false
        type: string

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.changes.body.from != null && github.event.release.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch release (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETA_REPO_TOKEN: ${{ secrets.BETA_REPO_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "$INPUT_TAG" == *-* ]]; then
            # Beta tag: Test Drive builds live in the PRIVATE repo (release.yml
            # publishes them there), so this is how betas are announced — after
            # writing their notes with `gh release edit --repo <private repo>`.
            # The embed links the Test Drive page: testers cannot open the
            # private repo, and the download is gated there.
            GH_TOKEN="$BETA_REPO_TOKEN" gh api "repos/WnDTech/AcEvoFfbTuner-TestDrive/releases/tags/$INPUT_TAG" \
              --jq '{name: .name, tag_name: .tag_name, html_url: "https://ffbtuner.wndtech.tips/beta.html", body: .body, prerelease: true}' \
              > release-manual.json
          elif [ -n "$INPUT_TAG" ]; then
            # Stable tag given: fetch that exact public release.
            # REST API, not `gh release view --json` — gh's JSON fields are
            # tagName/url/isPrerelease, so the snake_case names the script
            # reads made that call fail outright.
            gh api "repos/WnDTech/AcEvoFfbTuner/releases/tags/$INPUT_TAG" \
              --jq '{name: .name, tag_name: .tag_name, html_url: .html_url, body: .body, prerelease: .prerelease}' \
              > release-manual.json
          else
            gh api repos/WnDTech/AcEvoFfbTuner/releases/latest \
              --jq '{name: .name, tag_name: .tag_name, html_url: .html_url, body: .body, prerelease: .prerelease}' \
              > release-manual.json
          fi

      - name: Post to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: '1440318628661825587'
          DISCORD_BETA_CHANNEL_ID: ${{ vars.DISCORD_BETA_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MANUAL_RELEASE_FILE: ${{ github.workspace }}/release-manual.json
        run: python3 .github/scripts/discord_release_notify.py
