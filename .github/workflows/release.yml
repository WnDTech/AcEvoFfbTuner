name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.0)'
        required: true
        type: string

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'src/AcEvoFfbTuner/AcEvoFfbTuner.csproj'
  CONFIGURATION: Release
  # Private repo holding Test Drive (beta) releases — see website/api/config.php BETA_GH_REPO.
  BETA_REPO: 'WnDTech/AcEvoFfbTuner-TestDrive'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
            $ver = $Matches[1]
          } elseif ('${{ github.event.inputs.version }}') {
            $ver = '${{ github.event.inputs.version }}'
          } else {
            $ver = '0.0.0-dev'
          }
          # Beta builds: tag "v1.29.0-beta.1" → prerelease release; the ASSEMBLY
          # version must stay numeric (System.Version cannot parse the suffix),
          # so the build uses the numeric part only.
          $beta = if ($ver -match '-') { 'true' } else { 'false' }
          $buildVer = ($ver -split '-')[0]
          "version=$ver" >> $env:GITHUB_OUTPUT
          "buildVersion=$buildVer" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT
          "prerelease=$beta" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore AcEvoFfbTuner.slnx

      - name: Build
        run: dotnet build AcEvoFfbTuner.slnx -c ${{ env.CONFIGURATION }} -p:Version=${{ steps.version.outputs.buildVersion }} -p:InformationalVersion=${{ steps.version.outputs.version }} --no-restore

      - name: Publish (self-contained single-file)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c ${{ env.CONFIGURATION }}
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.buildVersion }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}
          -o ./publish

      - name: Fetch pinned vJoy installer (AC1 bridge, hash-verified)
        shell: pwsh
        run: .\installer\fetch-vjoy.ps1 -FailOnError

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $iss = Get-Content "installer\setup.iss" -Raw
          $iss = $iss -replace '#define AppVersion .+', "#define AppVersion ""$ver"""
          $iss = $iss -replace '\.\.\\publish-test', '..\publish'
          $iss = $iss -replace '\.\.\\src', '..\src'
          $iss = $iss -replace '\.\.\\README', '..\README'
          $iss = $iss -replace '\.\.\\installer-output', '..\installer-output'
          Set-Content -Path "installer\setup-ci.iss" -Value $iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\setup-ci.iss"

      # Beta builds NEVER go to this public repo: they are published to the
      # private Test Drive repo, and approved testers download them through the
      # Test Drive server (beta.php beta_releases / beta_download). Refuse to
      # run rather than fall back to a public prerelease.
      - name: Check Test Drive repo token (beta only)
        if: steps.version.outputs.prerelease == 'true'
        shell: pwsh
        env:
          BETA_REPO_TOKEN: ${{ secrets.BETA_REPO_TOKEN }}
        run: |
          if (-not $env:BETA_REPO_TOKEN) {
            Write-Error "BETA_REPO_TOKEN secret is not set - beta builds publish only to the private $env:BETA_REPO repo"
            exit 1
          }

      - name: Clean old assets from release
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.version.outputs.prerelease == 'true' && secrets.BETA_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ steps.version.outputs.prerelease == 'true' && env.BETA_REPO || github.repository }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = "${{ steps.version.outputs.tag }}"
          $existing = gh release view "$tag" --repo $env:RELEASE_REPO --json assets --jq ".assets[].name" 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            foreach ($asset in $existing) {
              Write-Host "Removing old asset: $asset"
              gh release delete-asset "$tag" "$asset" --repo $env:RELEASE_REPO --yes
            }
          } else {
            Write-Host "No existing release to clean for $tag in $env:RELEASE_REPO"
          }
          exit 0

      - name: Create Test Drive (beta) release in the private repo
        if: steps.version.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.BETA_REPO }}
          token: ${{ secrets.BETA_REPO_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: "AC Evo FFB Tuner ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: true
          generate_release_notes: false
          files: |
            ./installer-output/AcEvoFfbTuner-Setup-*.exe

      - name: Create GitHub Release
        if: steps.version.outputs.prerelease != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "AC Evo FFB Tuner ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./installer-output/AcEvoFfbTuner-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
